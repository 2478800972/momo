const TEST_REGISTRY = {
  lesbian: lesbianConfig,
  mbti: mbtiConfig,
};

// ============================================================
// 3. 核心引擎（单例）
// ============================================================
class TestEngine {
  constructor() {
    this.currentTestId = null;
    this.answers = {};
    this.submitted = false;
    this.copied = false;
    this.config = null;
    this.questionsContainer = null;
    this.progressFill = null;
    this.progressText = null;
    this.submitBtn = null;
    this.liveRegion = document.getElementById('liveRegion');
    this.isShareMode = false;
    this.initTestSelector();
    this.handleUrlParams();
  }

  // ---- 处理URL参数 ----
  handleUrlParams() {
    const params = new URLSearchParams(window.location.search);
    const resultParam = params.get('result');
    if (resultParam) {
      try {
        const parts = resultParam.split('|');
        if (parts.length >= 2) {
          const testId = parts[0];
          const typeKey = parts[1];
          const confidence = parseInt(parts[2]) || 85;
          if (TEST_REGISTRY[testId]) {
            this.currentTestId = testId;
            this.config = TEST_REGISTRY[testId];
            this.isShareMode = true;
            this.submitted = true;
            this.updateTestSelector();
            this.updateHero();
            const type = this.config.typeProfiles.find(p => p.key === typeKey);
            if (type) {
              const scores = {};
              Object.keys(this.config.dimensions).forEach(d => {
                scores[d] = type.target[d] || 50;
              });
              this.renderResultFromType(type, scores, confidence);
              if (window.history && window.history.replaceState) {
                const cleanUrl = window.location.href.split('?')[0];
                window.history.replaceState({}, document.title, cleanUrl);
              }
              return;
            }
          }
        }
      } catch(e) {
        console.warn('解析分享参数失败', e);
      }
    }
    const firstId = Object.keys(TEST_REGISTRY)[0];
    if (firstId) this.switchTest(firstId);
  }

  // ---- 初始化测试选择按钮 ----
  initTestSelector() {
    const container = document.getElementById('testSelector');
    container.innerHTML = '';
    Object.keys(TEST_REGISTRY).forEach(id => {
      const btn = document.createElement('button');
      btn.className = 'test-btn';
      btn.dataset.test = id;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', 'false');
      let label = TEST_REGISTRY[id].title;
      if (id === 'lesbian') label = '🌈 女同关系气场';
      else if (id === 'mbti') label = '🧠 16型人格';
      else label = TEST_REGISTRY[id].title;
      btn.textContent = label;
      btn.onclick = () => {
        if (this.isShareMode) {
          this.isShareMode = false;
          this.submitted = false;
          this.answers = {};
          if (window.history && window.history.replaceState) {
            const cleanUrl = window.location.href.split('?')[0];
            window.history.replaceState({}, document.title, cleanUrl);
          }
        }
        this.switchTest(id);
      };
      container.appendChild(btn);
    });
  }

  // ---- 切换测试 ----
  switchTest(testId) {
    if (!TEST_REGISTRY[testId]) return;
    if (this.currentTestId && this.answers) {
      this.saveState();
    }
    this.currentTestId = testId;
    this.config = TEST_REGISTRY[testId];
    this.restoreState();
    this.updateTestSelector();
    this.updateHero();
    if (this.submitted && !this.isShareMode) {
      this.renderResult();
    } else {
      this.renderQuestions();
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    this.announce('已切换到 ' + this.config.title);
  }

  // ---- 动态更新分享卡片 meta 标签 ----
  updateMetaTags(title, desc) {
    let ogTitle = document.querySelector('meta[property="og:title"]');
    if (!ogTitle) {
      ogTitle = document.createElement('meta');
      ogTitle.setAttribute('property', 'og:title');
      document.head.appendChild(ogTitle);
    }
    ogTitle.setAttribute('content', title);

    let ogDesc = document.querySelector('meta[property="og:description"]');
    if (!ogDesc) {
      ogDesc = document.createElement('meta');
      ogDesc.setAttribute('property', 'og:description');
      document.head.appendChild(ogDesc);
    }
    ogDesc.setAttribute('content', desc);

    let descMeta = document.querySelector('meta[name="description"]');
    if (descMeta) {
      descMeta.setAttribute('content', desc);
    }
  }

  // ---- 更新按钮高亮 ----
  updateTestSelector() {
    document.querySelectorAll('.test-btn').forEach(btn => {
      const id = btn.dataset.test;
      const isActive = id === this.currentTestId;
      btn.classList.toggle('active', isActive);
      btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
    });
  }

  // ---- 更新hero（增强版：确保元素存在） ----
  updateHero() {
    // 确保 hero 容器存在
    let hero = document.querySelector('.hero');
    if (!hero) {
      hero = document.createElement('section');
      hero.className = 'hero';
      const testSelector = document.getElementById('testSelector');
      testSelector.parentNode.insertBefore(hero, testSelector.nextSibling);
    }
    // 确保 h1 存在
    let h1 = hero.querySelector('h1');
    if (!h1) {
      h1 = document.createElement('h1');
      hero.prepend(h1);
    }
    h1.textContent = this.config.title;

    // 确保 p 存在
    let p = hero.querySelector('p');
    if (!p) {
      p = document.createElement('p');
      hero.appendChild(p);
    }
    p.textContent = this.config.subtitle;

    document.title = this.config.title + '｜多选心理测试';
    if (!this.submitted || this.isShareMode === false) {
      this.updateMetaTags(this.config.title, this.config.subtitle);
    }
  }

  // ---- 本地存储 ----
  saveState() {
    if (!this.currentTestId) return;
    const key = `test_${this.currentTestId}_answers`;
    localStorage.setItem(key, JSON.stringify(this.answers));
    localStorage.setItem(`test_${this.currentTestId}_submitted`, String(this.submitted));
  }

  restoreState() {
    const key = `test_${this.currentTestId}_answers`;
    const stored = localStorage.getItem(key);
    if (stored) {
      try {
        this.answers = JSON.parse(stored);
      } catch(e) { this.answers = {}; }
    } else {
      this.answers = {};
    }
    const submittedKey = `test_${this.currentTestId}_submitted`;
    this.submitted = localStorage.getItem(submittedKey) === 'true';
    this.copied = false;
  }

  // ---- 辅助 ----
  announce(msg) {
    if (this.liveRegion) {
      this.liveRegion.textContent = msg;
    }
  }

  // ---- 计算分数 ----
  computeScores() {
    const dims = this.config.dimensions;
    const raw = {}, maxAbs = {};
    Object.keys(dims).forEach(k => { raw[k] = 0; maxAbs[k] = 0; });
    this.config.questions.forEach(([id, text, scores]) => {
      const selected = this.answers[id];
      if (!selected) return;
      const centered = selected - 4;
      Object.entries(scores).forEach(([dim, w]) => {
        raw[dim] += centered * w;
        maxAbs[dim] += 3 * Math.abs(w);
      });
    });
    const out = {};
    Object.keys(dims).forEach(k => {
      out[k] = maxAbs[k] ? Math.round(this.clamp(50 + (raw[k] / maxAbs[k]) * 50)) : 50;
    });
    return out;
  }

  clamp(v, min = 0, max = 100) { return Math.min(max, Math.max(min, v)); }
  esc(s) { return String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[m])); }

  // ---- 惩罚函数 ----
  consistencyPenalty(scores, p) {
    let x = 0;
    if (this.currentTestId === 'mbti') {
      const ei = Math.min(scores.extraversion, scores.introversion);
      if (ei > 65) x += (ei - 65) * 1.2;
      const ns = Math.min(scores.intuition, scores.sensing);
      if (ns > 65) x += (ns - 65) * 1.2;
      const tf = Math.min(scores.thinking, scores.feeling);
      if (tf > 65) x += (tf - 65) * 1.2;
      const jp = Math.min(scores.judging, scores.perceiving);
      if (jp > 65) x += (jp - 65) * 1.2;
      if (ei > 60 && ns > 60 && tf > 60 && jp > 60) x += 50;
    } else {
      const both = Math.min(scores.dominance, scores.surrender);
      if (!["chaoticSwitch","caretakerBottom"].includes(p.key) && both > 68) x += (both - 68) * 0.75;
      const aa = Math.min(scores.attachment, scores.avoidance);
      if (!["catBottom","dangerBottom","phantomRomantic","chaoticSwitch"].includes(p.key) && aa > 66) x += (aa - 66) * 0.7;
      const bp = Math.min(scores.avoidance, scores.possessive);
      if (!["catBottom","chaoticSwitch","boundaryWitch"].includes(p.key) && bp > 70) x += (bp - 70) * 0.65;
      if (p.key === "chaoticSwitch") {
        const switchCore = Math.min(scores.dominance, scores.surrender);
        const fluidity = (scores.teasing + scores.softness + scores.attachment) / 3;
        if (switchCore < 66) x += (66 - switchCore) * 1.15;
        if (fluidity < 64) x += (64 - fluidity) * 0.75;
        if (scores.avoidance > 78) x += (scores.avoidance - 78) * 0.45;
      }
    }
    return x;
  }

  distance(scores, p) {
    let sum = 0, wt = 0;
    Object.keys(scores).forEach(d => {
      const w = (p.weights && p.weights[d]) || 1;
      const diff = scores[d] - p.target[d];
      sum += w * diff * diff;
      wt += w;
    });
    return Math.sqrt(sum / wt) + this.consistencyPenalty(scores, p);
  }

  chooseType(scores) {
    const ranked = this.config.typeProfiles
      .map(p => Object.assign({}, p, { distance: this.distance(scores, p) }))
      .sort((a, b) => a.distance - b.distance);
    const best = ranked[0];
    const second = ranked[1];
    const margin = second ? second.distance - best.distance : 0;
    return Object.assign({}, best, {
      confidence: Math.round(this.clamp(100 - best.distance * 2.05 + margin * 1.2, 42, 96)),
      alternatives: ranked.slice(1, 4)
    });
  }

  bar(v, white) {
    return '<div class="bar"><div class="bar-fill ' + (white ? 'white-fill' : '') + '" style="width:' + v + '%"></div></div>';
  }

  // ---- 渲染题目（增量更新） ----
  renderQuestions() {
    // 确保 hero 显示当前测试的标题和副标题
    this.updateHero();

    const app = document.getElementById('app');
    const total = this.config.questions.length;
    const completed = Object.keys(this.answers).length;

    if (this.questionsContainer && app.contains(this.questionsContainer)) {
      this.updateProgress(completed, total);
      document.querySelectorAll('.opt').forEach(btn => {
        const qId = Number(btn.dataset.q);
        const val = Number(btn.dataset.v);
        btn.classList.toggle('active', this.answers[qId] === val);
      });
      if (this.submitBtn) {
        this.submitBtn.disabled = (completed !== total);
      }
      if (!this.isShareMode) {
        this.updateMetaTags(this.config.title, this.config.subtitle);
      }
      return;
    }

    const html = `
      <section class="progress-card card" id="progressCard">
        <div class="card-inner">
          <div class="progress-top">
            <div><h2>答题进度</h2><p>请选择最符合你真实状态的答案。不要按理想人设选。</p></div>
            <div style="color:rgba(255,255,255,.7);font-size:14px" id="progressText">${completed}/${total}</div>
          </div>
          <div style="margin-top:16px">
            <div class="bar"><div class="bar-fill" id="progressFill" style="width:${(completed/total*100)}%"></div></div>
          </div>
        </div>
      </section>
      <section class="questions" id="questionsContainer">
        ${this.config.questions.map(([id, text]) => `
          <div class="q-card card">
            <div class="card-inner">
              <div class="q-flex">
                <div class="q-num">${id}</div>
                <div style="flex:1;min-width:0">
                  <p class="q-text">${this.esc(text)}</p>
                  <div class="opts">
                    ${[1,2,3,4,5,6,7].map(val => {
                      const label = SCALE_LABELS[val-1];
                      const active = this.answers[id] === val ? 'active' : '';
                      return `<button class="opt ${active}" data-q="${id}" data-v="${val}" title="${this.esc(label)}">
                        <span class="full">${this.esc(label)}</span><span class="short">${val}</span>
                      </button>`;
                    }).join('')}
                  </div>
                  <div class="scale-help"><span>完全不符合</span><span>看情况</span><span>非常符合</span></div>
                </div>
              </div>
            </div>
          </div>
        `).join('')}
      </section>
      <div class="sticky">
        <button id="submitBtn" class="btn btn-white" ${completed === total ? '' : 'disabled'}>查看我的结果</button>
      </div>
      <footer class="app-footer">本测试仅用于娱乐与自我探索，不构成专业心理评估。</footer>
    `;

    app.innerHTML = html;

    this.questionsContainer = document.getElementById('questionsContainer');
    this.progressFill = document.getElementById('progressFill');
    this.progressText = document.getElementById('progressText');
    this.submitBtn = document.getElementById('submitBtn');

    document.querySelectorAll('.opt').forEach(btn => {
      btn.onclick = () => {
        const qId = Number(btn.dataset.q);
        const val = Number(btn.dataset.v);
        this.answers[qId] = val;
        const parentOpts = btn.closest('.opts');
        parentOpts.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const completedNow = Object.keys(this.answers).length;
        this.updateProgress(completedNow, total);
        if (this.submitBtn) {
          this.submitBtn.disabled = (completedNow !== total);
        }
        this.saveState();
        this.announce(`已选择第${qId}题，当前进度${completedNow}/${total}`);
      };
    });

    if (this.submitBtn) {
      this.submitBtn.onclick = () => {
        if (Object.keys(this.answers).length === total) {
          this.submitted = true;
          this.copied = false;
          this.saveState();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          this.renderResult();
        }
      };
    }

    if (!this.isShareMode) {
      this.updateMetaTags(this.config.title, this.config.subtitle);
    }
  }

  updateProgress(completed, total) {
    if (this.progressFill) {
      this.progressFill.style.width = (completed / total * 100) + '%';
    }
    if (this.progressText) {
      this.progressText.textContent = `${completed}/${total}`;
    }
  }

  // ---- 渲染结果（支持预设类型和分数，用于分享模式） ----
  renderResultFromType(type, scores, confidence) {
    const result = Object.assign({}, type, {
      confidence: confidence || 85,
      alternatives: this.config.typeProfiles.filter(p => p.key !== type.key).slice(0, 3)
    });
    this._renderResultDirect(result, scores);
  }

  renderResult() {
    const scores = this.computeScores();
    const result = this.chooseType(scores);
    this._renderResultDirect(result, scores);
  }

  _renderResultDirect(result, scores) {
    // 确保 hero 显示
    this.updateHero();

    const app = document.getElementById('app');
    const dims = this.config.dimensions;
    const hints = this.config.dimensionHints || {};
    const icons = this.config.icons || {};

    const top = Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 4);
    document.title = result.name + '｜' + this.config.title;

    const metaTitle = result.name + '｜' + this.config.title;
    const metaDesc = result.summary;
    this.updateMetaTags(metaTitle, metaDesc);

    const shareBadge = this.isShareMode ? '<div class="share-badge">📎 好友分享的结果</div>' : '';

    const html = `
      <section class="result-wrap">
        <div class="result-hero">
          <div class="result-gradient" style="--c1:${result.colors[0]};--c2:${result.colors[1]};--c3:${result.colors[2]}">
            <div class="result-grid">
              <div>
                ${shareBadge}
                <div class="pill" style="background:rgba(255,255,255,.16);border:0">${icons[result.icon] || '✨'} 你的测试结果是</div>
                <h2 class="result-title">${this.esc(result.name)}</h2>
                <p class="english">${this.esc(result.english)}</p>
                <div class="tags">${result.tags.map(t => `<span class="tag">${this.esc(t)}</span>`).join('')}</div>
                <div class="topdims">${top.map(([k, v]) =>
                  `<div class="dimtile"><div class="dimrow"><span>${this.esc(dims[k])}</span><b>${v}</b></div>${this.bar(v, true)}</div>`
                ).join('')}</div>
              </div>
              <div class="score-panel">
                <div class="confidence"><span>匹配置信度</span><b>${result.confidence}%</b></div>
                ${this.bar(result.confidence, true)}
                <div class="compact-bars">${Object.entries(dims).map(([k, label]) =>
                  `<div class="compact-row"><span>${this.esc(label)}</span>${this.bar(scores[k], true)}<span>${scores[k]}</span></div>`
                ).join('')}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="two-col">
          <div class="card"><div class="card-inner"><h3 class="section-title">核心解析</h3><p class="body-text">${this.esc(result.summary)}</p><p class="body-text">${this.esc(result.detail)}</p></div></div>
          <div class="card"><div class="card-inner"><h3 class="section-title">你的相邻人格</h3><p class="body-text" style="font-size:14px;line-height:1.8;color:rgba(255,255,255,.55)">如果你觉得结果有一点点偏差，通常会落在这几个相邻类型之间。</p>
            <div class="alt-list">${result.alternatives.map(item =>
              `<div class="alt"><div class="alt-left"><div class="alt-icon">${icons[item.icon] || '✨'}</div><div><div class="alt-name">${this.esc(item.name)}</div><div class="alt-en">${this.esc(item.english)}</div></div></div><div>${Math.round(this.clamp(100 - item.distance * 2.05, 30, 92))}%</div></div>`
            ).join('')}</div>
          </div></div>
        </div>

        <div class="card"><div class="card-inner"><h3 class="section-title">完整维度分数</h3><div class="dimension-grid">
          ${Object.entries(dims).map(([k, label]) =>
            `<div class="dimension-box"><div class="dimrow"><span>${this.esc(label)}</span><b>${scores[k]}</b></div>${this.bar(scores[k], true)}<p class="hint">${this.esc(hints[k] || '')}</p></div>`
          ).join('')}
        </div></div></div>

        <div class="card"><div class="card-inner"><h3 class="section-title">温馨提示</h3><p class="body-text">本测试结果仅供参考，不构成专业心理评估。每个人都是复杂的，测试只是帮助你更好地认识自己。</p></div></div>

        <div class="reward-card">
          <div class="reward-inner">
            <div>
              <div class="reward-eyebrow">🍓 投喂开发者</div>
              <h3 class="reward-title">愿意支持一下吗？</h3>
              <p class="reward-text">如果这个测试对你有启发，可以请开发者喝杯奶茶。后续会不断更新更多有趣的测试。</p>
              <p class="reward-note">完全自愿，感谢每一位支持者。</p>
            </div>
            <div class="qr-box">
              <img src="https://cloudflare-imgbed-1t9.pages.dev/file/赞赏/1773752330180_赞赏码.png" alt="投喂收款码" class="qr-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
              <div class="qr-fallback" style="display:none"><div class="qr-icon">▦</div><p>将收款码图片命名为 <b>reward-qrcode.png</b><br>放在同一目录下</p></div>
              <p class="qr-caption">投喂一点点灵感基金</p>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="copyBtn" class="btn btn-white">${this.copied ? '✓ 已复制结果' : '📋 复制我的结果'}</button>
          <button id="shareBtn" class="btn btn-outline">🔗 链接分享结果</button>
          <button id="resetBtn" class="btn btn-outline">↻ 重新测试</button>
        </div>
      </section>
      <footer class="app-footer">本测试仅用于娱乐与自我探索，不构成专业心理评估。</footer>
    `;

    app.innerHTML = html;

    document.getElementById('resetBtn').onclick = () => {
      this.answers = {};
      this.submitted = false;
      this.copied = false;
      this.isShareMode = false;
      this.saveState();
      document.title = this.config.title;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      this.renderQuestions();
      this.announce('已重置测试');
    };

    document.getElementById('copyBtn').onclick = () => {
      const text = '我的测试结果：' + result.name + '｜' + result.english +
        '\n关键词：' + result.tags.join('、') +
        '\n匹配置信度：' + result.confidence + '%' +
        '\n' + result.summary;
      if (navigator.clipboard && location.protocol === 'https:') {
        navigator.clipboard.writeText(text).then(() => {
          this.copied = true;
          this.renderResult();
          this.announce('结果已复制到剪贴板');
        }).catch(() => this.fallbackCopy(text));
      } else {
        this.fallbackCopy(text);
      }
    };

    document.getElementById('shareBtn').onclick = () => {
      const shareData = {
        title: this.config.title,
        text: `我的测试结果：${result.name}（${result.english}）\n关键词：${result.tags.join('、')}\n匹配置信度：${result.confidence}%\n${result.summary}`,
        url: window.location.href.split('?')[0] + '?result=' + encodeURIComponent(
          this.currentTestId + '|' + result.key + '|' + result.confidence
        )
      };

      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        const url = shareData.url;
        if (navigator.clipboard && location.protocol === 'https:') {
          navigator.clipboard.writeText(url).then(() => {
            this.announce('分享链接已复制，可发送给好友');
            alert('分享链接已复制到剪贴板，您可粘贴发送给朋友。');
          }).catch(() => {
            this.fallbackCopy(url);
          });
        } else {
          this.fallbackCopy(url);
        }
      }
    };
  }

  fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      this.copied = true;
      this.renderResult();
      this.announce('结果已复制到剪贴板');
    } catch(e) {
      alert('复制失败，请手动复制以下内容：\n' + text);
    }
    document.body.removeChild(ta);
  }

  // ---- 配置校验 ----
  validateConfig(config) {
    if (!config.id || !config.title || !config.dimensions || !config.questions || !config.typeProfiles) {
      console.error('配置不完整', config);
      return false;
    }
    const dims = Object.keys(config.dimensions);
    config.typeProfiles.forEach(p => {
      dims.forEach(d => {
        if (!(d in p.target)) {
          console.warn(`类型 ${p.key} 缺少维度 ${d}，将使用默认值50`);
          p.target[d] = 50;
        }
      });
    });
    return true;
  }
}

// ============================================================
// 4. 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  Object.values(TEST_REGISTRY).forEach(cfg => {
    if (!window.engine) {
      window.engine = new TestEngine();
    }
    window.engine.validateConfig(cfg);
  });
  if (!window.engine) {
    window.engine = new TestEngine();
  }
});
</script>
